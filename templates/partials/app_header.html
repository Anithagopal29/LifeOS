{% load static %}
<header class="app-header">
    <div class="left">
        <div class="avatar">
            {% if profile.avatar %}
                <img src="{{ profile.avatar.url }}" alt="">
            {% else %}
                <img src="https://ui-avatars.com/api/?name={{ display_name|default:'User' }}&background=DCE5CE&color=466038&size=80&bold=true" alt="">
            {% endif %}
        </div>
        <h1 class="greeting {% if sage_title %}sage{% endif %}">{{ title|default:"LifeOS" }}</h1>
    </div>
    <button class="bell" type="button" aria-label="Notifications">
        <i data-lucide="bell"></i>
    </button>
</header>
