# render.yaml — Render Blueprint for LifeOS
# With this file in your repo root you can deploy via Render's
# "New + → Blueprint" flow, which creates the web service AND the
# PostgreSQL database together and wires DATABASE_URL automatically.

databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos_db
    user: lifeos_user

services:
  - type: web
    name: lifeos
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn lifeos.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true            # Render generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
